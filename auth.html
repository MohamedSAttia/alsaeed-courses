<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدخول والتسجيل — منصة السعيد PMP®‎ | Al Saeed ETC</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#0b4034;--green2:#06251c;--em:#0e7a55;--em2:#17a06d;--gold:#c9a13b;--gold2:#e2bf67;
--ink:#182420;--mut:#75857c;--line:#d7e5dc;--bad:#b3261e;--ok:#1e8e4e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(150deg,var(--green2),var(--green) 60%,#0d5a43);padding:24px;color:var(--ink)}
.box{background:#fff;border-radius:24px;max-width:440px;width:100%;padding:34px 30px;box-shadow:0 26px 70px rgba(0,0,0,.4)}
.logo{width:70px;height:70px;border-radius:18px;background:#fff;border:1.5px solid var(--line);padding:6px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(11,64,52,.15)}
.logo img{width:100%;height:100%;object-fit:contain}
h1{text-align:center;font-size:18px;color:var(--green)}
.sub{text-align:center;font-size:12px;color:var(--mut);margin:4px 0 18px}
.tabs{display:flex;background:#eef4f0;border-radius:14px;padding:5px;margin-bottom:18px}
.tabs button{flex:1;border:none;background:none;border-radius:10px;padding:10px;font-size:13.5px;font-weight:700;color:var(--mut);transition:.2s}
.tabs button.sel{background:#fff;color:var(--green);box-shadow:0 3px 10px rgba(11,64,52,.12)}
label{font-size:12.5px;color:var(--mut);font-weight:700;display:block;margin:12px 0 5px}
input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:inherit}
input:focus{outline:none;border-color:var(--em)}
input.ltr{direction:ltr;text-align:left}
.go{width:100%;margin-top:20px;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;color:#fff;
background:linear-gradient(135deg,var(--em),var(--em2));box-shadow:0 8px 20px rgba(14,122,85,.3);transition:.2s}
.go:hover{filter:brightness(1.07)}
.go:disabled{opacity:.6}
.msg{display:none;border-radius:12px;padding:11px 14px;font-size:13px;margin-top:14px;line-height:1.9}
.msg.err{display:block;background:#fdecea;color:var(--bad);border:1px solid #f3c2be}
.msg.ok{display:block;background:#e8f6ee;color:var(--ok);border:1px solid #bfe3cd}
.foot{text-align:center;font-size:12px;color:var(--mut);margin-top:18px}
.foot a{color:var(--em);font-weight:700;text-decoration:none}
form{display:none}form.on{display:block}
.hint{font-size:11.5px;color:var(--mut);margin-top:4px}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><img src="https://alsaeed-etc.com/main/images/logo/logo3.png" alt="Al Saeed ETC" onerror="this.parentNode.textContent='س'"></div>
  <h1>منصة السعيد لمحاكاة اختبار PMP®‎</h1>
  <div class="sub">Al Saeed for Education, Training &amp; Consulting</div>

  <div class="tabs">
    <button id="tLogin" class="sel" onclick="switchTab('login')">تسجيل الدخول</button>
    <button id="tReg" onclick="switchTab('register')">إنشاء حساب جديد</button>
  </div>

  <form id="fLogin" class="on" onsubmit="return doLogin(event)">
    <label>البريد الإلكتروني</label>
    <input id="lEmail" class="ltr" type="email" autocomplete="username" required placeholder="you@email.com">
    <label>كلمة المرور</label>
    <input id="lPass" class="ltr" type="password" autocomplete="current-password" required>
    <button class="go" id="lBtn">دخول</button>
  </form>

  <form id="fReg" onsubmit="return doRegister(event)">
    <label>الاسم الكامل *</label>
    <input id="rName" required maxlength="80" placeholder="الاسم الثلاثي كما سيظهر في تقاريرك">
    <label>البريد الإلكتروني *</label>
    <input id="rEmail" class="ltr" type="email" autocomplete="username" required placeholder="you@email.com">
    <div class="hint">إن كان بريدك مضافًا لدينا ضمن المسدِّدين فسيُفعَّل حسابك تلقائيًا.</div>
    <label>رقم الجوال (واتساب)</label>
    <input id="rPhone" class="ltr" placeholder="+9665XXXXXXXX">
    <label>كلمة المرور (8 أحرف فأكثر) *</label>
    <input id="rPass" class="ltr" type="password" autocomplete="new-password" required minlength="8">
    <button class="go" id="rBtn">إنشاء الحساب</button>
  </form>

  <div class="msg" id="msg"></div>
  <div class="foot"><a href="/">⬅ العودة للصفحة الرئيسية</a></div>
</div>

<script>
const $=id=>document.getElementById(id);
const nextUrl=(new URLSearchParams(location.search).get('next'))||'';
function switchTab(t){
  $('tLogin').classList.toggle('sel',t==='login');
  $('tReg').classList.toggle('sel',t==='register');
  $('fLogin').classList.toggle('on',t==='login');
  $('fReg').classList.toggle('on',t==='register');
  $('msg').className='msg';
}
if(location.hash==='#register')switchTab('register');
function msg(text,kind){const m=$('msg');m.textContent=text;m.className='msg '+kind;}
async function api(action,data){
  const r=await fetch('/api/app?action='+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  return r.json();
}
function goNext(role,status){
  if(nextUrl&&/^\/[a-z0-9._\-]*$/i.test(nextUrl)){location.href=nextUrl;return;}
  if(role==='admin'){location.href='/admin.html';return;}
  location.href=status==='active'?'/exam.html':'/dashboard.html';
}
async function doLogin(e){
  e.preventDefault();$('lBtn').disabled=true;
  try{
    const r=await api('login',{email:$('lEmail').value,pass:$('lPass').value});
    if(r.ok){msg('✅ تم الدخول — جارٍ التحويل...','ok');goNext(r.role,r.status);}
    else if(r.err==='blocked')msg('⛔ هذا الحساب محظور — تواصل مع الإدارة.','err');
    else msg('❌ البريد أو كلمة المرور غير صحيحة.','err');
  }catch(x){msg('تعذر الاتصال بالخادم — أعد المحاولة.','err');}
  $('lBtn').disabled=false;return false;
}
async function doRegister(e){
  e.preventDefault();$('rBtn').disabled=true;
  try{
    const r=await api('register',{name:$('rName').value,email:$('rEmail').value,phone:$('rPhone').value,pass:$('rPass').value});
    if(r.ok){
      if(r.status==='active'){msg('🎉 تم تفعيل حسابك تلقائيًا — جارٍ فتح المنصة...','ok');setTimeout(()=>goNext('student','active'),700);}
      else{msg('✅ أُنشئ حسابك بنجاح — ستنتقل الآن لخطوات تفعيل الاشتراك.','ok');setTimeout(()=>location.href='/dashboard.html',900);}
    }
    else if(r.err==='exists')msg('هذا البريد مسجَّل من قبل — جرّب تسجيل الدخول.','err');
    else if(r.err==='weak')msg('كلمة المرور قصيرة — 8 أحرف على الأقل.','err');
    else if(r.err==='name')msg('اكتب اسمك الكامل.','err');
    else msg('تحقق من صحة البريد الإلكتروني.','err');
  }catch(x){msg('تعذر الاتصال بالخادم — أعد المحاولة.','err');}
  $('rBtn').disabled=false;return false;
}
/* لو مسجَّل مسبقًا حوّله مباشرة */
(async()=>{try{const r=await fetch('/api/app?action=me');const b=await r.json();if(b.me)goNext(b.me.role,b.me.status);}catch(e){}})();
</script>
</body>
</html>
